<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1b1b1f">
<title>Ôn tập trắc nghiệm – Lịch sử 12</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<style>
:root{--bg:#1b1b1f;--card:#2a2a30;--card2:#232328;--line:#3d3d46;--tx:#f2f2f4;--mu:#a4a4b0;--or:#ff9f1a;--orb:rgba(255,159,26,.16);--ok:#34c759;--bad:#ff453a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{padding-bottom:env(safe-area-inset-bottom)}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
#app{max-width:860px;margin:0 auto;padding:10px 12px 70px}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:4px 0 10px;position:sticky;top:0;background:var(--bg);z-index:5}
.tab{flex:1 0 auto;padding:12px 14px;border-radius:14px;border:1px solid var(--line);background:var(--card2);white-space:nowrap;font-weight:600}
.tab.on{background:var(--orb);border-color:var(--or);color:var(--or)}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;margin:0 0 14px}
.card h2{margin:0 0 12px;font-size:20px}
.card h2 small{font-size:13px;color:var(--mu);font-weight:600}
.inp{width:100%;padding:14px;border-radius:14px;border:1px solid var(--line);background:var(--card2);outline:none}
.inp:focus{border-color:var(--or)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mode{padding:14px 8px;border-radius:14px;border:1px solid var(--line);background:var(--card2);text-align:center}
.mode b{display:block}.mode span{color:var(--mu);font-size:14px}
.mode.on{background:#503f2c;border-color:var(--or)}.mode.on b{color:var(--or)}
.row{display:flex;align-items:center;gap:12px;padding:14px;border-radius:16px;border:1px solid var(--line);background:var(--card2);margin-bottom:10px;cursor:pointer;user-select:none}
.row.on{background:#4f3f2c;border-color:var(--or)}
.row .tt{flex:1;min-width:0;overflow-wrap:anywhere}
.row .tt b{text-transform:none}
.row .n{color:var(--mu);white-space:nowrap;font-size:15px}
.cb{width:28px;height:28px;border-radius:7px;border:2px solid var(--mu);flex:0 0 auto;display:grid;place-items:center;font-weight:900;color:#1b1b1f}
.row.on .cb{background:var(--or);border-color:var(--or)}.row.on .cb::after{content:"✓"}
.btn{padding:13px 18px;border-radius:14px;border:1px solid var(--line);background:var(--card2);font-weight:700;min-height:46px}
.btn.pri{background:var(--or);border-color:var(--or);color:#1b1b1f}
.btn.dan{border-color:var(--bad);color:var(--bad)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.start{display:block;width:100%;padding:18px;font-size:20px;border-radius:20px;margin:4px 0 14px}
.resume{display:block;width:100%;padding:18px 14px;margin:0 0 14px;border-radius:18px;border:2px solid #fff3;background:linear-gradient(90deg,#ff7a00,#ffb400);color:#1b1b1f;font-weight:900;font-size:18px;text-align:center}
.chips{display:flex;gap:8px;flex-wrap:wrap}.chip{padding:11px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card2);font-weight:600}
.chip.on{background:var(--orb);border-color:var(--or);color:var(--or)}
.mu{color:var(--mu)}.sm{font-size:14px}
.li{border:1px solid var(--line);background:var(--card2);border-radius:16px;padding:14px;margin-bottom:10px}
.li .r{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.badge{display:inline-block;padding:2px 10px;border-radius:99px;font-size:13px;font-weight:700;background:#444;margin-right:6px}
.badge.ok{background:rgba(52,199,89,.2);color:var(--ok)}.badge.bad{background:rgba(255,69,58,.2);color:var(--bad)}.badge.sk{background:#555;color:#ddd}
.bar{height:8px;border-radius:9px;background:#444;overflow:hidden;margin-top:8px}.bar i{display:block;height:100%;background:var(--bad)}
.lbr{display:flex;gap:10px;align-items:center;padding:12px;border-radius:14px;background:var(--card2);border:1px solid var(--line);margin-bottom:8px}
.lbr.me{border-color:var(--or);background:var(--orb)}
.lbr .rk{width:34px;font-weight:900;text-align:center;font-size:18px}.lbr .nm{flex:1;min-width:0;overflow-wrap:anywhere}.lbr .sc{text-align:right;font-weight:800;color:var(--or)}
/* quiz */
.top{position:fixed;left:0;right:0;top:0;z-index:10;background:var(--bg);border-bottom:1px solid var(--line);padding:calc(8px + env(safe-area-inset-top)) 12px 8px}
.top .in,.foot .in{max-width:860px;margin:0 auto}
.t1{display:flex;align-items:center;gap:10px}.t1 .st{flex:1;font-weight:800;color:var(--or);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.t2{display:flex;gap:6px;margin-top:8px;overflow-x:auto}
.sbtn{padding:7px 12px;border-radius:10px;border:1px solid var(--line);background:var(--card2);white-space:nowrap;font-size:14px;min-height:36px}
.sbtn.on{background:var(--orb);border-color:var(--or);color:var(--or)}
.qwrap{padding:calc(114px + env(safe-area-inset-top)) 0 100px}
.qcard{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px}
.qsec{color:var(--or);font-weight:700;font-size:14px}.qno{font-size:26px;font-weight:900;margin:2px 0 8px}
.qtext{font-size:18px;overflow-wrap:anywhere}.qtext b{font-weight:800}
.qhint{color:var(--mu);font-size:14px;margin:10px 0 12px}
.qimg{max-width:100%;border-radius:12px;margin:10px 0}
table.qt{border-collapse:collapse;margin:10px 0;width:100%;font-size:15px;display:block;overflow-x:auto}
table.qt th,table.qt td{border:1px solid #666;padding:6px 10px;text-align:left;vertical-align:top}
table.qt th{background:#3a3a42}
.opt{display:flex;align-items:center;gap:12px;padding:12px;border-radius:16px;border:1.5px solid var(--line);background:var(--card2);margin-bottom:10px;cursor:pointer;min-height:56px}
.opt .lt{width:36px;height:36px;border-radius:50%;border:2px solid var(--mu);display:grid;place-items:center;font-weight:800;flex:0 0 auto}
.opt .ot{flex:1;min-width:0;overflow-wrap:anywhere}
.opt.sel{background:var(--orb);border-color:var(--or)}.opt.sel .lt{background:var(--or);border-color:var(--or);color:#1b1b1f}
.opt.ok{background:rgba(52,199,89,.15);border-color:var(--ok)}.opt.ok .lt{background:var(--ok);border-color:var(--ok);color:#111}
.opt.bad{background:rgba(255,69,58,.15);border-color:var(--bad)}.opt.bad .lt{background:var(--bad);border-color:var(--bad);color:#111}
.opt.xx .ot{text-decoration:line-through;opacity:.4}
.opt .xb{border:0;background:transparent;color:var(--mu);font-size:18px;padding:6px 10px;border-radius:8px}
.tfrow{padding:12px;border-radius:16px;border:1.5px solid var(--line);background:var(--card2);margin-bottom:10px}
.tfrow.ok{border-color:var(--ok);background:rgba(52,199,89,.12)}.tfrow.bad{border-color:var(--bad);background:rgba(255,69,58,.12)}
.tfb{display:flex;gap:10px;margin-top:10px}.tfbtn{flex:1;padding:12px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);font-weight:700}
.tfbtn.on{background:var(--or);border-color:var(--or);color:#1b1b1f}
.tfres{margin-top:8px;font-size:14px;font-weight:700}
.sin{width:100%;max-width:380px;display:block;margin:12px auto;padding:16px;font-size:22px;text-align:center;border-radius:16px;border:2px solid var(--or);background:var(--card2);outline:none}
.sin.ok{border-color:var(--ok)}.sin.bad{border-color:var(--bad)}
.expl{margin-top:14px;padding:14px;border-radius:14px;background:#2f3a2f;border:1px solid #4a6b4a;white-space:pre-wrap;overflow-wrap:anywhere}
.note{margin-top:14px}.note textarea{width:100%;min-height:76px;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--card2);resize:vertical}
.foot{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--bg);border-top:1px solid var(--line);padding:10px 12px calc(10px + env(safe-area-inset-bottom))}
.foot .in{display:flex;align-items:center;justify-content:space-between;gap:10px}
.fl{display:flex;align-items:center;gap:8px;font-weight:700}.fl .btn{padding:8px 14px;min-height:44px}
.main{min-width:150px;font-size:17px}
#toast{position:fixed;left:50%;bottom:92px;transform:translate(-50%,20px);opacity:0;pointer-events:none;z-index:50;max-width:92%;padding:13px 18px;border-radius:16px;font-weight:700;transition:.2s;text-align:center;box-shadow:0 8px 30px #0008}
#toast.show{opacity:1;transform:translate(-50%,0)}
#toast.good{background:#ffb02e;color:#222}#toast.bad{background:#3a2323;border:1px solid var(--bad);color:#ffd7d3}#toast.info{background:#2f3340;border:1px solid #556;color:#e5e8ff}
.nht{position:fixed;right:14px;bottom:10px;font-weight:900;font-size:22px;letter-spacing:2px;color:var(--or);opacity:.85;pointer-events:none;z-index:4}
body.inquiz .nht{bottom:84px}
#modal .mback{position:fixed;inset:0;background:#000a;z-index:60;display:flex;align-items:center;justify-content:center;padding:16px}
.mbox{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px;max-width:520px;width:100%;max-height:88vh;overflow:auto}
.mbox h3{margin:0 0 8px}.mbtns{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px;justify-content:flex-end}
.qg{display:grid;grid-template-columns:repeat(auto-fill,minmax(46px,1fr));gap:8px}
.qg button{padding:10px 0;border-radius:10px;border:1px solid var(--line);background:var(--card2);font-weight:700}
.qg .a{background:var(--orb);border-color:var(--or)}.qg .g{background:rgba(52,199,89,.2);border-color:var(--ok)}.qg .w{background:rgba(255,69,58,.2);border-color:var(--bad)}.qg .c{outline:2px solid #fff}
#pad{display:none;position:fixed;left:0;right:0;z-index:8;touch-action:none;cursor:crosshair}
#padbar{display:none;position:fixed;right:8px;z-index:9;gap:6px;background:#000c;padding:6px;border-radius:12px;flex-wrap:wrap;max-width:94%}
.pc{width:30px;height:30px;border-radius:50%;border:2px solid #fff6}
#crash{display:none;position:fixed;inset:0;z-index:999;background:#000d;align-items:center;justify-content:center;padding:16px}
.cbox{background:var(--card);border:2px solid var(--bad);border-radius:18px;padding:18px;max-width:560px;width:100%}.cbox pre{white-space:pre-wrap;overflow:auto;max-height:40vh;background:#111;padding:10px;border-radius:10px;font-size:13px}
.res{text-align:center}.res .big{font-size:56px;font-weight:900;color:var(--or);margin:6px 0}
@media(max-width:480px){.qtext{font-size:17px}.main{min-width:130px}}
</style>
</head>
<body>
<div id="app"><div class="card">Đang tải ứng dụng…</div></div>
<div id="modal"></div>
<div id="toast"></div>
<canvas id="pad"></canvas>
<div id="padbar">
<button class="pc" style="background:#fff" data-act="padcolor" data-c="#ffffff"></button>
<button class="pc" style="background:#ff9f1a" data-act="padcolor" data-c="#ff9f1a"></button>
<button class="pc" style="background:#5ac8fa" data-act="padcolor" data-c="#5ac8fa"></button>
<button class="pc" style="background:#ff453a" data-act="padcolor" data-c="#ff453a"></button>
<button class="pc" style="background:#34c759" data-act="padcolor" data-c="#34c759"></button>
<button class="sbtn" data-act="paderaser">🧽 Tẩy</button>
<button class="sbtn" data-act="padclear">🗑️ Xóa trắng</button>
<button class="sbtn" data-act="padoff">✖ Tắt</button>
</div>
<div class="nht">NHT</div>
<input type="file" id="impFile" accept=".json,application/json" hidden>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>

ents": [{"id": "a", "text": "Đoạn tư liệu phản ánh nguyên tắc hoạt động của Liên hợp quốc, do các thành viên phê chuẩn", "correct": true}, {"id": "b", "text": "Một trong những nguyên tắc hoạt động của Liên hợp quốc là các quốc gia thành viên thực hiện những nghĩa vụ đảm nhận theo Hiến chương Liên hợp quốc", "correct": true}, {"id": "c", "text": "Văn bản pháp lí của Liên hợp quốc đã góp phần ngăn chặn mọi xung đột vũ trang trên thế giới.", "correct": false}, {"id": "d", "text": "Việt Nam đã vận dụng nguyên tắc hoạt động của Liên hợp quốc để giải quyết vấn đề Biển Đông.", "correct": true}], "explanation": ""}, {"id": 51, "lesson": "Bài 1", "lessonTitle": "Liên hợp quốc", "section": "Phần II. Câu trắc nghiệm đúng sai", "num": "3", "type": "truefalse", "question": "cho đoạn tư liệu sau đây:<br>[ Năm 1960] “ Đại hội đồng Liên hợp quốc đã thông qua bản Tuyên ngôn về thủ tiêu hoàn toàn chủ nghĩa thực dân, trao trả độc lập cho các quốc gia và dân tộc thuộc địa. Đó là một sự kiện chính trị quan trọng. Như thế, Tuyên ngôn đã khẳng định các nước thực dân đã vi phạm nguyên tắc quan trọng nhất của luật pháp quốc tế khẳng định rõ ràng cơ sở pháp lí quốc tế của cuộc đấu tranh giành độc lậ của các dân tộc bị áp bức”<br>( Nguyễn Quốc Hùng, Nguyễn Hồng Quân, Liên hợp quốc và lực lượn gìn giũ hoà bình Liên hợ quốc, NXB Chính trị Quốc gia, Hà Nội, 2008, tr.46)", "image": "", "statements": [{"id": "a", "text": "Theo đoạn trích Liên hợp quốc đã đưa ra văn bản quan trọng nhằm thủ tiêu hệ thống thuộc địa của chủ nghĩa thực dân trên toàn thế giới.", "correct": true}, {"id": "b", "text": "Bản Tuyên ngôn của Liên hợp quốc đã tác động tiêu cực đến phong trào đấu tranh giải phóng ở các nước thuộc địa và phụ thuộc trên thế giới.", "correct": false}, {"id": "c", "text": "Lực lượng gìn giữ hoà bình của Liên hợp quốc đã giúp tổ chức này thực thi các nhiệm vụ bảo vệ nền hoà bình ở các nước thuộc địa", "correct": false}, {"id": "d", "text": "Đoạn trích là sự phản ánh về văn bản quan trọng thể hiện vai trò và đóng góp của Liên hợp quốc vì sự tiến ộ của nhân loại.", "correct": true}], "explanation": ""}, {"id": 52, "lesson": "Bài 1", "lessonTitle": "Liên hợp quốc", "section": "Phần II. Câu trắc nghiệm đúng sai", "num": "4", "type": "truefalse", "question": "Cho những thông tin trong bảng sau đây:<br><table class=\"qt\"><tr><th>Thời gian<\/th><th>Nội dung<\/th><\/tr><tr><td>Năm 1939<\/td><td>Chiến tranh thế giới thứ hai bùng nổ.<\/td><\/tr><tr><td>Năm 1942<\/td><td>Tuyên bố về Liên hợp quốc ra đời.<\/td><\/tr><tr><td>Năm 1943<\/td><td>Hội nghị Tê-hê-ran khẳng định việc thành lập Liên hợp quốc.<\/td><\/tr><tr><td>Năm 1945<\/td><td>Liên hợp quốc ra đời.<\/td><\/tr><tr><td>Năm 1977<\/td><td>Việt Nam gia nhập Liên hợp quốc.<\/td><\/tr><\/table>", "image": "", "statements": [{"id": "a", "text": "Bảng thông tin thể hiện về những vấn đề liên quan đến Liên hợp quốc.", "correct": true}, {"id": "b", "text": "Liên hợp quốc ra đời xuất phát từ khát vọng hòa bình của nhân loại.", "correct": true}, {"id": "c", "text": "Mỹ, Anh, Liên Xô vừa mâu thuẫn, vừa hợp tác với nhau trong vấn đề thành lập và duy trì hoạt động của Liên hợp quốc.", "correct": true}, {"id": "d", "text": "Việt Nam và Liên hợp quốc đều đóng góp cho sự phát triển thông qua việc khởi xướng và thực hiện các mục tiêu thiên niên kỉ.", "correct": false}], "explanation": ""}, {"id": 53, "lesson": "Bài 1", "lessonTitle": "Liên hợp quốc", "section": "Phần II. Câu trắc nghiệm đúng sai", "num": "5", "type": "truefalse", "question": "Cho những thông tin trong bảng sau đây:<br><table class=\"qt\"><tr><th>Thời gian<\/th><th>Nội dung<\/th><\/tr><tr><td>Năm 1945<\/td><td>Hội nghị I-an-ta (Liên Xô) và Hội nghị Pốt-xđam (Đức) được tổ chức; Liên hợp<br>quốc thành lập.<\/td><\/tr><tr><td>Năm 1947<\/td><td>Mỹ phát động Chiến tranh lạnh chống Liên Xô.<\/td><\/tr><tr><td>Năm 1949<\/td><td>Cách mạng Trung Quốc thành công, nước Cộng hoà nhân dân Trung Hoa ra đời;<br>Tổ chức Hiệp ước Bắc Đại Tây Dương được thành lập.<\/td><\/tr><tr><td> "Mỹ và Anh.", "Nga và Mỹ."], "correct": 1, "explanation": ""}, {"id": 134, "lesson": "Bài 2+3", "lessonTitle": "Trật tự thế giới trong và sau Chiến tranh lạnh", "section": "Phần I. Trắc nghiệm nhiều lựa chọn", "num": "81", "type": "single", "question": "Sau khi Chiến tranh lạnh kết thúc, các dân tộc trên thế giới mong muốn và ủng hộ xu thế nào sau đây?", "image": "", "options": ["Hoà hoãn và cạnh tranh.", "Mở rộng liên kết khi vực.", "Thoả hiệp, giảm kiềm chế.", "Đối thoại, hợp tác."], "correct": 3, "explanation": ""}, {"id": 135, "lesson": "Bài 2+3", "lessonTitle": "Trật tự thế giới trong và sau Chiến tranh lạnh", "section": "Phần I. Trắc nghiệm nhiều lựa chọn", "num": "82", "type": "single", "question": "Nhận xét nào sau đây phản ánh đúng tác động của các trung tâm, các tổ chức kinh tế, tài chính quốc tế và khu vực tới quan hệ quốc tế sau Chiến tranh lạnh?", "image": "", "options": ["Hạn chế sự phát triển của xu thế toàn cầu hóa.", "Làm suy giảm hoàn toàn ảnh hưởng của các nước lớn.", "Làm giảm sự phụ thuộc lẫn nhau giữa các quốc gia.", "Củng cố xu thế đa cực, nhiều trung tâm."], "correct": 3, "explanation": ""}, {"id": 136, "lesson": "Bài 2+3", "lessonTitle": "Trật tự thế giới trong và sau Chiến tranh lạnh", "section": "Phần I. Trắc nghiệm nhiều lựa chọn", "num": "83", "type": "single", "question": "Một trong những quyết định quan trọng của Hội nghị I-an-ta (1945) là", "image": "", "options": ["Phân chia phạm vi ảnh hưởng ở châu Âu và châu Á", "Nhanh chóng khắc phục hậu quả của chiến tranh thế giới.", "Tổ chức một trật tự thế giới mới sau Chiến tranh lạnh.", "Phân công nhiệm vụ giải giáp phát xít Nhật ở Đông Dương."], "correct": 0, "explanation": ""}, {"id": 137, "lesson": "Bài 2+3", "lessonTitle": "Trật tự thế giới trong và sau Chiến tranh lạnh", "section": "Phần I. Trắc nghiệm nhiều lựa chọn", "num": "84", "type": "single", "question": "Trong giai đoạn từ năm 1945 đến đầu những năm 70 của thế kỷ XX, trật tự thế giới hai cực I-an-ta có biểu hiện nào sau đây?", "image": "", "options": ["Xu thế hòa hoãn là chủ đạo.", "Hợp tác diễn ra trên nhiều lĩnh vực.", "Giải thế các liên minh quân sự.", "Đối đầu diễn ra trên nhiều lĩnh vực."], "correct": 3, "explanation": ""}, {"id": 138, "lesson": "Bài 2+3", "lessonTitle": "Trật tự thế giới trong và sau Chiến tranh lạnh", "section": "Phần I. Trắc nghiệm nhiều lựa chọn", "num": "86", "type": "single", "question": "Sự kiện nào sau đây là biểu hiện của sự xác lập và phát triển của trật tự thế giới hai cực I-an-ta (từ năm 1945 đến đầu những năm 70 của thế kỉ XX)?", "image": "", "options": ["Sự ra đời của Kế hoạch phục hưng châu Âu.", "Sự giải thể của Hội đồng tương trợ kinh tế (SEV).", "Sự tan rã của tổ chức Hiệp ước Vác-sa-va.", "Thành lập Cộng đồng Kinh tế ASEAN (AEC)."], "correct": 0, "explanation": ""}, {"id": 139, "lesson": "Bài 2+3", "lessonTitle": "Trật tự thế giới trong và sau Chiến tranh lạnh", "section": "Phần I. Trắc nghiệm nhiều lựa chọn", "num": "87", "type": "single", "question": "Sau chiến tranh lạnh, lĩnh vực nào sau đây trở thành trung tâm trong quan hệ quốc tế?", "image": "", "options": ["Văn hóa", "Giáo dục.", "Kinh tế", "Y tế"], "correct": 2, "explanation": ""}, {"id": 140, "lesson": "Bài 2+3", "lessonTitle": "Trật tự thế giới trong và sau Chiến tranh lạnh", "section": "Phần I. Trắc nghiệm nhiều lựa chọn", "num": "88", "type": "single", "question": "Nội dung nào sau đây là biểu hiện của xu thế đa cực trong quan hệ quốc tế sau Chiến tranh lạnh?", "image": "", "options": ["Ấn Độ trở thành cường quốc kinh tế, khoa học-kĩ thuật đứng đầu thế giới.", "Mỹ đã thiết lập được trật tự thế giới \"đơn cực\" và giữ vai trò lãnh đạo.", "Các trung tâm quyền lực vươn lên khẳng định sức mạnh trên nhiều lĩnh vực.", "Các liên minh quân sự xuất hiện ngày càng nhiều và ra sức chạy đua vũ trang."], "correct": 2, "explanation": ""}, {"id": 141, "lesson": "Bài 2+3", "lessonTitle": "Trật tự thế giới trong và sau Chiến tranh lạnh", "section": "Phần I. Trắc nghiệm nhiều lựa chọn", "num": "89", "type": "single", "question": "Vì sao từ sau Chiến tranh thế giới thứ hai (1945), Mỹ và Liên Xô đối đầu gay gắt?", "image": "", "options": ["Khác nhau về mục tiêu và đường lối chiến lược.", "Do những mâu thuẫn trong hội nghị I-an-ta (1945).", "Mâu thuẫn gay gắt về vấn đề thị trường, thuộc địa.", "Sự cạnh tranh gay gắt về ngành công nghiệp vũ trụ."], "correct": 0, "explanation": ""}, {"id": 142, "lesson": "Bài 2+3", "lessonTitle": "Trật tự thế giới trong và sau Chiến tranh lạnh", "section": "Phần I. Trắc nghiệm nhiều lựa chọn", "num": "90", "type": "single", "question": "Trong xu thế phát triển chung của thế giới hiện nay, thời cơ Việt Nam có thể tận dụng để xây dựng và phát triển đất nước là gì?", "image": "", "options": ["Không bị áp dụng luật chống bán phá giá.", "Sự ổn định tình hình chính trị trong nước.", "Mua được các bằng phát minh với giá rẻ.", "Thu hút vốn, tiếp thu thành tựu khoa học."], "correct": 3, "explanation": ""}, {"id": 143, "lesson": "Bài 2+3", "lessonTitle": "Trật tự thế giới trong và sau Chiến tranh lạnh", "section": "Phần II. Câu trắc nghiệm đúng sai", "num": "1", "type": "truefalse", "question": "Cho những thông tin trong bảng sau đây, chọn đúng hoặc sai", "image": "", "statements": [{"id": "a", "text": "Hội nghị I-an-ta (2 - 1945) được xem là hội nghị khởi đầu cho việc hình thành một trật tự thế giới mới sau khi Chiến tranh thế giới thứ hai kết thúc trên toàn thế giới.", "correct": true}, {"id": "b", "text": "Phát biểu của Tổng thống Mỹ G. Bút-sơ trong cuộc gặp với Tổng Bí thư Đảng Cộng sản Liên Xô M. Goóc-ba-chốp (12 - 1989) đánh dấu kết thúc hoàn toàn cuộc đối đầu quân sự tại châu Âu.", "correct": false}, {"id": "c", "text": "Việc Mỹ đề ra “Kế hoạch Mác-san” còn Liên Xô và các nước Đông Âu thành lập Hội đồng tương trợ kinh tế (SEV) đã tạo ra sự đối đầu về chính trị, quân sự giữa hai hệ thống xã hội đối lập.", "correct": false}, {"id": "d", "text": "Tổng thống Mỹ R. Nich-xơn có chuyến thăm chính thức đầu tiên tới Liên Xô đã mở đầu cho sự xói mòn và đi đến sụp đổ của trật tự thế giới hai cực I-an-ta.", "correct": false}], "explanation": ""}, {"id": 144, "lesson": "Bài 2+3", "lessonTitle": "Trật tự thế giới trong và sau Chiến tranh lạnh", "section": "Phần II. Câu trắc nghiệm đúng sai", "num": "2", "type": "truefalse", "question": "Đọc đoạn tư liệu sau đây:<br>“Sau hai tháng làm việc, qua các cuộc đấu tranh gay gắt giữa nhiều ý kiến và khuynh hướng khác nhau, hiến chương Liên Hợp Quốc được đại biểu của 50 nước ký kết ngày 26-6-1945. Hiến chương bắt đầu có hiệu lực kể từ ngày 24-10-1945 (ngày Quốc hội 5 cường quốc Liên Xô, Mỹ, Anh, Pháp và Trung Quốc thông qua Hiến chương Liên Hợp Quốc) và ngày này cũng được coi là ngày Liên Hợp Quốc chính thức được thành lập”.<br>(Nguyễn Anh Thái (chủ biên), Lịch sử thế giới hiện đại, Nxb Giáo dục, Hà Nội, 2015, tr.226)", "image": "", "statements": [{"id": "a", "text": "Ngày 24-10-1945, bản Hiến chương Liên Hợp Quốc chính thức có hiệu lực, đánh dấu sự thành lập của Liên Hợp Quốc.", "correct": true}, {"id": "b", "text": "Sự thông qua và có hiệu lực của Hiến chương Liên Hợp Quốc đã thiết lập một nền tảng pháp lý cho việc duy trì hòa bình và an ninh quốc tế trong giai đoạn sau chiến tranh thế giới.", "correct": true}, {"id": "c", "text": "Sự ra đời của Liên Hợp Quốc đánh dấu một bước ngoặt quan trọng trong việc xây dựng hệ thống an ninh tập toàn cầu, nhằm ngăn chặn xung đột và bảo bình quốc tế.", "correct": true}, {"id": "d", "text": "Hiến chương Liên Hợp Quốc được ký kết ngay sau khi Chiến tranh thế giới thứ hai kết thúc mà không gặp phải bất kỳ sự phản đối hay tranh luận nào từ các đại biểu tham gia.", "correct": false}], "explanation": ""}, {"id": 145, "lesson": "Bài 2+3", "lessonTitle": "Trật tự thế giới trong và sau Chiến tranh lạnh", "section": "Phần II. Câu trắc nghiệm đúng sai", "num": "3", "type": "truefalse", "question": "Đọc đoạn tư liệu sau đây:<br>“Sự kết thúc của trật tự thế giới 2 cực Ianta và Chiến tranh lạnh cùng với sự phát triển của cách mạng khoa học - công nghệ đã thúc đẩy mạnh mẽ quá trình toàn cầu hóa. Toàn cầu hóa là quá trình gia tăng mạnh mẽ của những mối liên hệ, sự phụ thuộc, tác động lẫn nhau giữa các quốc gia, dân tộc và khu vực trên phạm vi toàn cầu”.<br>(Trích SGK Lịch sử lớp 12 trang 19 - Bộ KNTN, NXB GDVN năm 2024).", "image": "", "statements": [{"id": "a", "text": "Sự hình thành xu thế đa cực và kết thúc Chiến tranh hạnh cùng với sự phát triển của cách mạng khoa - công đã thúc đẩy mẽ trình toàn hóa.", "correct": true}, {"id": "b", "text": "Xu thế toàn cầu hóa xuất hiện vào đầu những năm 80 là hệ quả của phong trào giải phóng dân tộc.", "correct": false}, {"id": "c", "text": "Bản chất của toàn cầu hóa là sự gia tăng mạnh mẽ của những mối liên hệ, phụ thuộc, tác động lẫn nhau giữa các quốc gia, dân tộc và khu vực trên phạm vi toàn cầu.", "correct": true}, {"id": "d", "text": "Trong xu thế toàn cầu hóa, Việt Nam cần tranh thủ thời cơ vượt qua thách thức để phát triển.", "correct": true}], "explanation": ""}, {"id": 146, "lesson": "Bài 2+3", "lessonTitle": "Trật tự thế giới trong và sau Chiến tranh lạnh", "section": "Phần II. Câu trắc nghiệm đúng sai", "num": "4", "type": "truefalse", "question": "Đọc đoạn tư liệu sau đây:<br>“Sự chấm dứt Chiến tranh lạnh và sự sụp đổ của hệ thống xã hội chủ nghĩa (XHCN) thể giới đã kết thúc thời kỳ thế giới hai cực, chấm dứt sự đối đầu giữa hai hệ thống chính trị, kinh tế, xã hội, mở ra một thời kỳ hội nhập kinh tế toàn cầu thực sự với sự chuyển đổi của hầu hết các quốc gia đã từng là XHCN, các quốc gia đang phát triển sang kinh tế thị trường, mở cửa hội nhập kinh tế quốc tế, xu thế hoà bình, hợp tác phát triển đã trở thành xu thế chính của thời đại. Đây là đặc trưng cực kỳ quan trọng”.<br>(Võ Đại Lược: Những vấn đề lớn về toàn cầu hóa kinh tế, Tạp chí Những vấn đề kinh tế và chính trị thế giới, số 9(125)-2006, tr.9.)", "image": "", "statements": [{"id": "a", "text": "Hòa bình, hợp tác và phát triển là dòng chảy chính của thời đại, phù hợp với khát vọng và mục tiêu của nhân loại.", "correct": true}, {"id": "b", "text": "Sau khi trật tự thế giới hai cực tan rã, sự dịch chuyển sức mạnh toàn cầu, trước hết là sức mạnh kinh tế diễn ra ngày càng mạnh mẽ.", "correct": true}, {"id": "c", "text": "Sự chấm dứt Chiến tranh lạnh là nguyên nhân dẫn đến sự sụp đổ của trật tự hai cực và mở ra xu thế toàn cầu hoá.", "correct": false}, {"id": "d", "text": "Đoạn tư liệu trên cho thấy sự sụp đổ của hệ thống xã hội chủ nghĩa trên thế giới đã kết thúc thời kì thế giới hai cực.", "correct": true}], "explanation": ""}, {"id": 147, "lesson": "Bài 2+3", "lessonTitle": "Trật tự thế giới trong và sau Chiến tranh lạnh", "section": "Phần II. Câu trắc nghiệm đúng sai", "num": "5", "type": "truefalse", "question": "Cho đoạn tư liệu sau đây:<br>“Trong trật tự thế giới hai cực I – an – ta, đã diễn ra một cuộc đối đầu gay gắt, quyết liệt và kéo dài tới gần bốn thập kỉ giữa hai “cực” Xô – Mỹ, làm cho cục diện thế giới luôn phức tạp, căng thẳng. Cuộc đối đầu này đã dẫn tới cuộc đối đầu giữa hai khối Đông – Tây, cuốn hút từng quốc gia, từng quốc gia khó đứng ngoài cuộc đối đầu này và chịu ảnh hưởng sâu sắc của cuộc đối đầu này”.<br>(Nguyễn Anh Thái, Lịch sử thế giới hiện đại từ 1945 đế 1995, quyển A,NXB Đại học Quốc gia Hà Nội, 1999, trang 32)", "image": "", "statements": [{"id": "a", "text": "Trong trật tự thế giới hai cực I – an – ta đã diễn ra cuộc đối đầu gay gắt, quyết liệt giữa hai cực Xô – Mỹ, làm cho thế giới luôn phức tạp, căng thẳng.", "correct": true}, {"id": "b", "text": "Với trật tự hai cực I – an – ta, Liên Xô và Mỹ đã đạt được những mục tiêu cơ bản chi phối cục diện thế giới, đồng thời trật tự này đã xâm phạm đến chủ quyền, lãnh thổ và lợi ích của nhiều nước.", "correct": true}, {"id": "c", "text": "Trong sự đối đầu 2 cực I – an – ta, cuộc chiến tranh cục bộ lớn nhất phản ánh mâu thuẫn giữa hai cực, hai phe là chiến tranh xâm lược Đông Dương của Pháp (1945 – 1954).", "correct": false}, {"id": "d", "text": "Sự tồn tại của Trật tự thế giới hai cực I – an – ta gắn liền với sự đối đầu giữa hai hệ thống xã hội đối lập là tư bản chủ nghĩa và xã hội chủ nghĩa.", "correct": true}], "explanation": ""}, {"id": 148, "lesson": "Bài 2+3", "lessonTitle": "Trật tự thế giới trong và sau Chiến tranh lạnh", "section": "Phần II. Câu trắc nghiệm đúng sai", "num": "6", "type": "truefalse", "question": "Đọc đoạn tư liệu sau:<br>“Thắng lợi của cách mạng Trung Quốc năm 1949 đã mở ra bước đột phá đầu tiên, phá vỡ âm mưu khống chế Trung Quốc của Mỹ và những đặc quyền của Liên Xô ở vùng Đông Bắc Trung Quốc. Đồng thời, sự lớn mạnh của các nước Tây Âu, Nhật Bản cũng làm suy giảm vị trí và ảnh hưởng của Mỹ trong hệ thống tư bản chủ nghĩa.”<br>(Theo Lịch sử thế giới hiện đại, Quyển 2, NXB Đại học sư phạm, 2016, tr.94)", "image": "", "statements": [{"id": "a", "text": "Thắng lợi của cách mạng Trung Quốc năm 1949 làm xói mòn trật tự 2 cực l-an-ta.", "correct": true}, {"id": "b", "text": "Sự lớn mạnh của các nước Tây Âu, Nhật Bản là do sự tài trợ, giúp đỡ vô điều kiện của Mỹ.", "correct": false}, {"id": "c", "text": "Sự lớn mạnh của các nước Tây Âu, Nhật Bản là một trong những nguyên nhân buộc Liên Xô và Mỹ tuyên bố chấm dứt chiến tranh lạnh.", "correct": true}, {"id": "d", "text": "Thắng lợi của cách mạng Trung Quốc năm 1949 đã đe dọa đến sự tồn tại của Liên Xô và Mỹ.", "correct": false}], "explanation": ""}, {"id": 149, "lesson": "Bài 2+3", "lessonTitle": "Trật tự thế giới trong và sau Chiến tranh lạnh", "section": "Phần II. Câu trắc nghiệm đúng sai", "num": "7", "type": "truefalse", "question": "Cho những thông tin trong bảng sau đây:<br><table class=\"qt\"><tr><th>Thời gian<\/th><th>Nội dung<\/th><\/tr><tr><td>Năm 1945<\/td><td>Trật tự hai cực Ianta được xác lập<\/td><\/tr><tr><td>Năm 1949<\/td><td>Cách mạng Trung Quốc thắng lợi<\/td><\/tr><tr><td>Từ những năm 50 – thế kỉ XX<\/td><td>Sự vươn lên mạnh mẽ của Tây Âu, Nhật Bản<\/td><\/tr><tr><td>Năm 1960<\/td><td>17 nước châu Phi giành độc lập<\/td><\/tr><tr><td>Đầu những năm 70 – thế kỉ XX<\/td><td>Các cuộc gặp gỡ cấp cao Xô – Mỹ diễn ra<\/td><\/tr><\/table>", "image": "", "statements": [{"id": "a", "text": "Một trong những nhân tố làm cho trật tự thế giới hai cực Ianta bắt đầu rạn nứt là thắng lợi của Cách mạng Trung Quốc (1949).", "correct": true}, {"id": "b", "text": "Các cuộc gặp gỡ cho thấy sự thay đổi trong chiến lược từ đối đầu sang hòa hoãn của cả Mỹ và Liên Xô, khiến các cuộc xung đột khu vực hoàn toàn chấm dứt từ đầu những năm 70 của thế kỉ XX.", "correct": false}, {"id": "c", "text": "Bảng thông tin trên đề cập đến sự suy yếu và đi đến sụp đổ của Trật tự thế giới hai cực Ianta.", "correct": false}, {"id": "d", "text": "Sự phát triển của phong trào giải phóng dân tộc ở Á – Phi – Mỹ Latinh từ sau năm 1945 góp phần làm đảo lộn chiến lược toàn cầu của Mỹ.", "correct": true}], "explanation": ""}, {"id": 150, "lesson": "Bài 2+3", "lessonTitle": "Trật tự thế giới trong và sau Chiến tranh lạnh", "section": "Phần II. Câu trắc nghiệm đúng sai", "num": "8", "type": "truefalse", "question": "Cho những thông tin trong bảng sau:<br><table class=\"qt\"><tr><th>Năm<\/th><th>Sự kiện<\/th><\/tr><tr><td>1949<\/td><td>Tổ chức Hiệp ước Bắc Đại Tây Dương (NATO) do Mỹ và các nước phương Tây thành lập.<\/td><\/tr><tr><td>1949<\/td><td>Cách mạng Trung Quốc thắng lợi.<\/td><\/tr><tr><td>1955<\/td><td>Liên Xô và các nước Đông Âu thành lập Tổ chức Hiệp ước Vác-sa-va.<\/td><\/tr><tr><td>1972<\/td><td>Chuyến thăm chính thức đầu tiên của Tổng thống Mỹ Nixon tới Liên Xô.<\/td><\/tr><tr><td>1972<\/td><td>Liên Xô và Mỹ đã đạt được thỏa thuận bước đầu về hạn chế vũ khí tiến công chiến lược.<\/td><\/tr><tr><td>1989<\/td><td>Mỹ và Liên Xô tuyên bố chấm dứt Chiến tranh lạnh.<\/td><\/tr><\/table>", "image": "", "statements": [{"id": "a", "text": "Sự ra đời của NATO và Tổ chức Hiệp ước Vác-sa-va là một biểu hiện của Trật tự thế giới hai cực I-an-ta.", "correct": true}, {"id": "b", "text": "Với thắng lợi của Cách mạng Trung Quốc (1949) chứng tỏ ngay trong giai đoạn xác lập và phát triển, Trật tự thế giới hai cực I-an-ta đã có biểu hiện của sự rạn nứt.", "correct": true}, {"id": "c", "text": "Trật tự thế giới hai cực I-an-ta chính thức sụp đổ khi Mỹ và Liên Xô tuyên bố chấm dứt Chiến tranh lạnh.", "correct": false}, {"id": "d", "text": "Trật tự thế giới hai cực I-an-ta suy yếu khi xu hướng hòa hoãn giữa Mỹ và Liên Xô bắt đầu xuất hiện từ đầu những năm 70 của thế kỷ XX.", "correct": true}], "explanation": ""}, {"id": 151, "lesson": "Bài 2+3", "lessonTitle": "Trật tự thế giới trong và sau Chiến tranh lạnh", "section": "Phần II. Câu trắc nghiệm đúng sai", "num": "9", "type": "truefalse", "question": "Đọc đoạn tư liệu sau đây:<br>“Bài học của thời kỳ Chiến tranh lạnh đã chứng tỏ phương thức trong quan hệ quốc tế lấy đối đầu chính trị - quân sự là chủ yếu không còn phù hợp, phải chịu nhiều tổn thất hoặc thất bại như hai nước Xô và Mỹ, một bị thương, một bị mất. Trong khi đó, phương thức hợp tác, cạnh tranh về kinh tế, chính trị lại thu được nhiều tiến bộ, kết quả như các nước Đức, Nhật và NICs. Sự hưng thịnh hay suy vọng của một quốc gia quyết định bởi sức mạnh tổng hợp của quốc gia đó, mà chủ yếu là thực lực kinh tế và khoa học – kỹ thuật.”<br>(Vũ Dương Ninh (Chủ biên), Một số chuyên đề lịch sử thế giới, NXB Đại học Quốc gia Hà Nội, Hà Nội, 2001, tr. 401)", "image": "", "statements": [{"id": "a", "text": "Chính trị - quân sự có vai trò quan trọng, quyết định nhất đối với sự phát triển của một quốc gia cả trong và sau thời kỳ Chiến tranh lạnh.", "correct": false}, {"id": "b", "text": "Hợp tác về kinh tế - chính trị làm suy yếu tiềm lực phát triển của nhiều nước.", "correct": false}, {"id": "c", "text": "Hợp tác và cạnh tranh về kinh tế là một nội dung thể hiện xu thế phát triển chính của thế giới sau Chiến tranh lạnh.", "correct": true}, {"id": "d", "text": "Đối đầu về chính trị - quân sự trong Chiến tranh lạnh của Mỹ và Liên Xô làm cho hai nước bị suy giảm trên nhiều lĩnh vực.", "correct": true}], "explanation": ""}, {"id": 152, "lesson": "Bài 2+3", "lessonTitle": "Trật tự thế giới trong và sau Chiến tranh lạnh", "section": "Phần II. Câu trắc nghiệm đúng sai", "num": "10", "type": "truefalse", "question": "Cho đoạn tư liệu sau đây:<br>“Khác với các trật tự trước kia không phân chia quyền lực giữa các đồng minh, trật tự Xô - Mỹ là sự canh tranh quyền lực giữa các đổi thủ đối kháng nhau. Mặt khác, trật tự ấy kết thúc một cách khác thường: không do chiến tranh, không có hiệp định ký kết, mà do một cực là Liên Xô tự tan rã. Những đặc điểm vừa nêu của trật tự thế giới Xô - Mỹ tạo thành yếu tổ đầu tiên tác động đến quá trình hình thành trật tự thế giới mới”.<br>(Nguyễn Viết Tháo: Trật tự thế giới trong kỉ nguyên toàn cầu hóa, https://www.tapchicongsan.org.vn)", "image": "", "statements": [{"id": "a", "text": "Trật tự thế giới hai cực I-an-ta là nhân tố hàng đầu chi phối quan hệ quốc tế phần lớn thời gian nửa sau thế kỉ XX.", "correct": true}, {"id": "b", "text": "Đoạn tư liệu đề cập đến Trật tự thế giới hai cực I-an-ta, được hình thành sau Chiến tranh thế giới thứ hai.", "correct": true}, {"id": "c", "text": "Sự tan rã của Liên Xô khiến cho chủ nghĩa xã hội không còn tồn tại, Chiến tranh lạnh thực sự chấm dứt.", "correct": false}, {"id": "d", "text": "Sự tan rã của chế độ xã hội chủ nghĩa ở Liên Xô là nguyên nhân sụp đổ của Trật tự thế giới hai cực Ian-ta.", "correct": true}], "explanation": ""}, {"id": 153, "lesson": "Bài 2+3", "lessonTitle": "Trật tự thế giới trong và sau Chiến tranh lạnh", "section": "Phần II. Câu trắc nghiệm đúng sai", "num": "11", "type": "truefalse", "question": "đoạn tư liệu sau đây:<br>“Vào thập niên 1980, mối quan hệ nồng ấm giữa Tổng thống Mỹ Ri-gân và nhà lãnh đạo Liên Xô Goóc-bachốp đã giúp giảm dần tình trạng căng thẳng của Chiến tranh lạnh. Năm 1987, hai nhà<br>lãnh đạo đã đồng ý huỷ bỏ tên lửa hạt nhân tầm trung. Năm 1989, Goóc-ba-chốp cho phép các quốc gia xã hội chủ nghĩa ở Đông Âu bầu ra chính phủ dân chủ, và đến năm 1991, Liên Xô tan rã thành 15 nước cộng hòa độc lập.”<br>(King Fisher, Bách khoa thư lịch sử (Nguyễn Đức Tĩnh và Ngô Minh Châu dịch),<br>NXB Thể giới, Hà Nội, 2016, tr.437)", "image": "", "statements": [{"id": "a", "text": "Trong thập niên 80 của thế kỉ XX, tình trạng căng thẳng của Chiến tranh lạnh diễn ra gay gắt.", "correct": false}, {"id": "b", "text": "Đoạn trích trên đề cập đến sự xói mòn và tan rã của trật tự thế giới hai cực I-an-ta.", "correct": true}, {"id": "c", "text": "Cục diện hai phe kết thúc bắt nguồn từ sự suy giảm tương đối sức mạnh của hai cực trong quan hệ quốc tế.", "correct": true}, {"id": "d", "text": "Điểm chung của các trật tự thế giới trong thế kỉ XX là đều suy yếu, sụp đổ khi có sự hòa hoãn, thỏa hiệp giữa các siêu cường.", "correct": false}], "explanation": ""}, {"id": 154, "lesson": "Bài 2+3", "lessonTitle": "Trật tự thế giới trong và sau Chiến tranh lạnh", "section": "Phần II. Câu trắc nghiệm đúng sai", "num": "12", "type": "truefalse", "question": "Đọc đoạn tư liệu sau đây:<br>“Những quyết định của Hội nghị cấp cao I-an-ta tháng 2-1945 đã trở thành những khuôn khổ của trật tự thế giới mới, từng bước được thiết lập trong những năm 1945 – 1947 sau khi chiến tranh kết thúc, thường được gọi là “Trật tự hai cực I-an-ta” (hai cực chỉ Mỹ và Liên Xô phân chia nhau phạm vị thế lực trên cơ sở thỏa thuận của Hội nghị I-an-ta)”.<br>(Nguyễn Anh Thái (Chủ biên), Lịch sử thế giới hiện đại, NXB Giáo dục Việt Nam, Hà Nội, 2021, tr.224)", "image": "", "statements": [{"id": "a", "text": "Hội nghị cấp cao I-an-ta diễn ra sau khi Chiến tranh thế giới thứ hai kết thúc.", "correct": false}, {"id": "b", "text": "Tác động quan trọng nhất của của Hội nghị I-an-ta đến quan hệ quốc tế xuất phát chủ yếu từ sự phân chia phạm vi thế lực của Mỹ và Liên Xô.", "correct": true}, {"id": "c", "text": "Những quyết định của Hội nghị I-an-ta đã xác lập cục diện hai cực, hai phe tư bản chủ nghĩa và xã hội chủ nghĩa trong quan hệ quốc tế.", "correct": false}, {"id": "d", "text": "Đoạn tư liệu đánh giá tác động của Hội nghị I-an-ta đến khuôn khổ trật tự thế giới sau Chiến tranh thế giới thứ hai.", "correct": true}], "explanation": ""}, {"id": 155, "lesson": "Bài 2+3", "lessonTitle": "Trật tự thế giới trong và sau Chiến tranh lạnh", "section": "Phần II. Câu trắc nghiệm đúng sai", "num": "13", "type": "truefalse", "question": "Cho đoạn tư liệu sau đây:<br>“Là tổ chức toàn cầu có vai trò hết sức quan trọng trong đời sống chính trị quốc tế và là nền tảng không thể thiếu cho một thế giới hòa bình, thịnh vượng và công bằng hơn. Trong hơn 70 năm qua đã góp phần ngăn chặn không để xảy ra một cuộc chiến tranh thế giới mới, hỗ trợ giải quyết nhiều cuộc xung đột và tranh chấp quốc tế, gìn giữ hòa bình, chấm dứt xung đột, hỗ trợ công cuộc tái thiết ở nhiều quốc gia thành viên. Thành công trong việc thúc đẩy quá trình phi thực dân hóa; …xây dựng được một hệ thống các công ước quốc tế về giải trừ quân bị, trong đó có Hiệp ước cấm phổ biến vũ khí hạt nhân (1968), Hiệp ước cấm thử hạt nhân toàn diện (1996), Công ước cấm vũ khí hóa học (1992) và Công ước cấm vũ khí sinh học (1972), Công ước cấm vũ khí hạt nhân (2017) tạo ra khuôn khổ pháp lý cho việc ngăn chặn phổ biến vũ khí hủy diệt hàng loạt, tiến tới xóa bỏ hoàn toàn các loại vũ khí này” (Báo điện tử Đảng cộng sản Việt Nam, https://dangcongsan.vn/thoi-su/lien-hop-quoc-to-chuc-khong-the-thieu-trong-nen-chinh-tri-the-gioi-591281.html )", "image": "", "statements": [{"id": "a", "text": "Đoạn tư liệu trên nói về vai trò quan trọng của tổ chức Liên Hợp Quốc trong việc duy trì hòa bình, an ninh thế giới và phát triển văn hóa, xã hội.", "correct": false}, {"id": "b", "text": "Liên Hợp Quốc đã cùng với nhân dân thuộc địa đấu tranh giải phóng dân tộc ở nhiều quốc gia, góp phần làm gia tăng số lượng thành viên của tổ chức.", "correct": false}, {"id": "c", "text": "Liên Hợp Quốc là tổ chức quốc tế có cơ cấu tổ chức chặt chẽ, phạm vi hoạt động rộng, thu hút được đông đảo thành viên tham gia.", "correct": true}, {"id": "d", "text": "Công ước cấm vũ khí hóa học (1992) được Liên Hợp Quốc đề đã tác động mạnh đến quá trình phi thực dân hóa trên phạm vi thế giới.", "correct": false}], "explanation": ""}, {"id": 156, "lesson": "Bài 2+3", "lessonTitle": "Trật tự thế giới trong và sau Chiến tranh lạnh", "section": "Phần II. Câu trắc nghiệm đúng sai", "num": "14", "type": "truefalse", "question": "Đọc đoạn tư liệu sau đây :<br>“Cuộc Chiến tranh lạnh (1947-1989) chủ yếu diễn ra ở châu Âu, nhưng đã làm thay đổi sâu sắc quan hệ quốc tế: giữa Mỹ với Liên Xô, giữa các nước Đông Âu với các nước Tây Âu, giữa các nước tư bản chủ nghĩa với các nước xã hội chủ nghĩa. Sự đối đầu gay gắt giữa Mỹ và Liên Xô trong thời gian diễn ra Chiến tranh lạnh đã làm gia tăng cuộc chạy đua vũ trang, dẫn đến một số cuộc chiến tranh cục bộ trên thế giới”.<br>(Nguyễn Anh Thái (chủ biên), Lịch sử thế giới hiện đại, Nxb Giáo dục, Hà Nội, 2015, tr.538)", "image": "", "statements": [{"id": "a", "text": "Đoạn tư liệu trên phản ánh những biểu hiện của Trật tự thế giới hai cực I-an-ta.", "correct": false}, {"id": "b", "text": "Một trong những nguyên nhân quyết định Mỹ và Liên Xô tuyên bố chấm dứt Chiến tranh lạnh (1989) là thắng lợi của phong trào giải phóng dân tộc trên thế giới.", "correct": false}, {"id": "c", "text": "Sau khi Liên Xô tan rã, Mỹ và Liên bang Nga tuyên bố chấm dứt Chiến tranh lạnh (1989).", "correct": false}, {"id": "d", "text": "Trong việc tiến hành Chiến tranh lạnh, châu Âu là mục tiêu chiến lược để Mỹ ngăn chặn ảnh hưởng của chủ nghĩa xã hội và đàn áp phong trào giải phóng dân tộc.", "correct": true}], "explanation": ""}, {"id": 157, "lesson": "Bài 2+3", "lessonTitle": "Trật tự thế giới trong và sau Chiến tranh lạnh", "section": "Phần II. Câu trắc nghiệm đúng sai", "num": "15", "type": "truefalse", "question": "Đọc đoạn tư liệu sau đây.<br>\"Sau Chiến tranh lạnh, Đông Nam Á bước vào một thời kỳ phát triển mới. Một trong những nhân tố chủ đạo vẽ nên bức tranh toàn cảnh của Đông Nam Á thời kì này là tiến trình liên kết khu vực. Chỉ trong vòng chưa đầy 10 năm, các nước Đông Nam Á đã hoàn tất quá trình khu vực hoa, được bắt đầu từ giữa thập niên \"một trung tâm quyền lực mới\" ở khu 60 của thế kỷ trước, đưa ASEAN trở thành một tổ chức toàn khu vực, vực châu Á - Thái Bình Dương với tính thích nghi cao, sự năng động và sức sống mạnh mẽ\".<br>(Lương Ninh, Lịch sử Đông Nam Á, Nxb Giáo dục, 2007,tr.603)", "image": "", "statements": [{"id": "a", "text": "Sự kết thúc của Chiến tranh lạnh đã tạo những điều kiện thuận lợi để Đông Nam Á phát triển.", "correct": true}, {"id": "b", "text": "Giai đoạn sau Chiến tranh lạnh, với nhiều cơ chế hợp tác với, ASEAN dần nâng cao vai trò và sức mạnh của mình, chi phối các quan hệ quốc tế.", "correct": false}, {"id": "c", "text": "Hiện nay, ASEAN là một trong những tổ chức liên kết khu vực thành công nhất thế giới.", "correct": true}, {"id": "d", "text": "Quá trình khu vực hóa của các nước Đông Nam Á được hoàn thành chỉ trong chưa đầy 10 năm kể từ khi tổ chức ASEAN được thành lập.", "correct": false}], "explanation": ""}, {"id": 158, "lesson": "Bài 2+3", "lessonTitle": "Trật tự thế giới trong và sau Chiến tranh lạnh", "section": "Phần II. Câu trắc nghiệm đúng sai", "num": "16", "type": "truefalse", "question": "Đọc đoạn tư liệu sau đây:<br>“Bài học của thời kì Chiến tranh lạnh đã chứng tỏ phương thức quan hệ quốc tế lấy đối đầu chính trị - quân sự là chủ yếu không còn phù hợp, phải chịu nhiều tổn thất hoặc thất bại như hai nước Xô - Mỹ và một bị thương, một bị mất. Trong khi đó, phương thức lấy hợp tác và cạnh tranh về kinh tế<br>- chính trị là chính lại thu được nhiều tiến bộ, kết quả như các nước Đức, Nhật và NICs. Sự hưng thịnh hay suy vong của một quốc gia quyết định bởi sức mạnh tổng hợp của quốc gia đó, mà chủ yếu là thực lực kinh tế và khoa học - kĩ thuật”.<br>(Vũ Dương Ninh (Chủ biên), Một số chuyên đề lịch sử thế giới, NXB Đại học Quốc gia Hà Nội, Hà Nội 2001, tr.401)", "image": "", "statements": [{"id": "a", "text": "Tiềm lực kinh tế, quốc phòng là yếu tố quan trọng đảm bảo an ninh chính trị của mỗi quốc gia sau khi Chiến tranh lạnh kết thúc.", "correct": true}, {"id": "b", "text": "Công cuộc cải tổ ở Liên Xô thất bại là một trong những nguyên nhân dẫn tới sự sụp đổ của Trật tự thế giới hai cực I-an-ta.", "correct": true}, {"id": "c", "text": "Sau thời kì Chiến tranh lạnh, các quốc gia điều chỉnh chiến lược phát triển lấy phát triển kinh tế làm trung tâm.", "correct": true}, {"id": "d", "text": "Sau Chiến tranh lạnh, Mỹ đã bước đầu thành công trong việc xóa bỏ trật tự thế giới đa cực và thiết lập trật tự thế giới đơn cực.", "correct": false}], "explanation": ""}, {"id": 159, "lesson": "Bài 2+3", "lessonTitle": "Trật tự thế giới trong và sau Chiến tranh lạnh", "section": "Phần II. Câu trắc nghiệm đúng sai", "num": "17", "type": "truefalse", "question": "Đọc đoạn tư liệu sau đây:<br>“Cuộc Chiến tranh lạnh (1947-1989) chủ yếu diễn ra ở châu Âu, nhưng đã làm thay đổi sâu sắc quan hệ quốc tế: giữa Mĩ với Liên Xô, giữa các nước Đông Âu với các nước Tây Âu, giữa các nước tư bản với các nước xã hội chủ nghĩa,... Sự đối đầu gay gắt giữa Mĩ và Liên Xô trong thời gian diễn ra Chiến tranh lạnh đã làm gia tăng cuộc chạy đua vũ trang, dẫn đến một số cuộc chiến tranh cục bộ trên thế giới”.<br>(Lịch sử thế giới hiện đại, Quyển 2, NXB Đại học Sư phạm, Hà Nội, 2016, tr.92)", "image": "", "statements": [{"id": "a", "text": "Cuộc Chiến tranh lạnh đã làm thay đổi quan hệ giữa các cường quốc từng là đồng minh trong chiến tranh chống chủ nghĩa phát xít.", "correct": true}, {"id": "b", "text": "Cuộc Chiến tranh lạnh tuy đã kết thúc nhưng vẫn để lại nhiều di chứng đến ngày nay.", "correct": true}, {"id": "c", "text": "Cuộc chiến tranh của Mĩ ở Việt Nam (1954-1975) không chịu sự tác động của Chiến tranh lạnh.", "correct": false}, {"id": "d", "text": "Một trong những nguyên nhân dẫn đến cuộc Chiến tranh lạnh là bắt nguồn từ những quyết định của Hội nghị I-an-ta.", "correct": true}], "explanation": ""}, {"id": 160, "lesson": "Bài 4", "lessonTitle": "Sự ra đời và phát triển của Hiệp hội các quốc gia Đông Nam Á (ASEAN)", "section": "Phần I. Trắc nghiệm nhiều lựa chọn", "num": "1", "type": "single", "question": "Nội dung nào sau đây là bối cảnh ra đời của tổ chức ASEAN?", "image": "", "options": ["Trật tự thế giới hai cực Ianta đã được xác lập.", "Liên Xô và các nước Đông Âu lâm vào khủng hoảng.", "Hệ thống tư bản chủ nghĩa tan rã, sụp đổ.", "Xu thế đối đầu Đông – Tây vừa mới xuất hiện."], "correct": 0, "explanation": ""}, {"id": 161, "lesson": "Bài 4", "lessonTitle": "Sự ra đời và phát triển của Hiệp hội các quốc gia Đông Nam Á (ASEAN)", "section": "Phần I. Trắc nghiệm nhiều lựa chọn", "num": "2", "type": "single", "question": "Quốc gia nào sau đây thành viên sáng lập của Hiệp hội các quốc gia Đông Nam Á (ASEAN)?", "image": "", "options": ["Mi-an-ma.", "Mông Cổ.", "Trung Quốc.", "Ma-lai-xi-a"], "correct": 3, "explanation": ""}, {"id": 162, "lesson": "Bài 4", "lessonTitle": "Sự ra đời và phát triển của Hiệp hội các quốc gia Đông Nam Á (ASEAN)", "section": "Phần I. Trắc nghiệm nhiều lựa chọn", "num": "3", "type": "single", "question": "Năm 1997, quốc gia nào sau đây gia nhập vào Hiệp hội các quốc gia Đông Nam Á (ASEAN)?", "image": "", "options": ["Thái Lan.", "Đức.", "Cam-pu-chia.", "Lào."], "correct": 3, "explanation": ""}, {"id": 163, "lesson": "Bài 4", "lessonTitle": "Sự ra đời và phát triển của Hiệp hội các quốc gia Đông Nam Á (ASEAN)", "section": "Phần I. Trắc nghiệm nhiều lựa chọn", "num": "4", "type": "single", "question": "Năm 1967, nước nào sau đây gia nhập tổ chức ASEAN?", "image": "", "options": ["Hà Lan.", "Ấn Độ.", "Hàn Quốc.", "Thái Lan."], "correct": 3, "explanation": ""}, {"id": 164, "lesson": "Bài 4", "lessonTitle": "Sự ra đời và phát triển của Hiệp hội các quốc gia Đông Nam Á (ASEAN)", "section": "Phần I. Trắc nghiệm nhiều lựa chọn", "num": "5", "type": "single", "question": "Quốc gia nào sau đây là thành viên sáng lập Hiệp hội các quốc gia Đông Nam Á (ASEAN)?", "image": "", "options": ["Mi-an-ma.", "Bru-nây.", "Xin-ga-po.", "Ca "", "options": ["Những diễn biến phức tạp của tình hình Biển Đông.", "Trình độ phát triển kinh tế giữa các thành viên chênh lệch.", "Sự đa dạng về chế độ chính trị của các nước thành viên.", "Chưa có sự hợp tác chặt chẽ về lĩnh vực kinh tế, xã hội."], "correct": 3, "explanation": ""}, {"id": 255, "lesson": "Bài 5", "lessonTitle": "Cộng đồng ASEAN: Từ ý tưởng đến hiện thực", "section": "Phần II. Câu trắc nghiệm đúng sai", "num": "1", "type": "truefalse", "question": "Cho đoạn tư liệu sau đây:<br>“Kể từ thời điểm năm quốc gia sáng lập ký Tuyên bố ASEAN (Tuyên bố Bangkok), năm 1967,đến nay, ASEAN đã phát triển và mở rộng thành một cộng đồng gồm mười thành viên, hướng tới mục tiêu đoàn kết tất cả các quốc gia ở Đông Nam Á. Vượt qua những thách thức trong tiến trình phát triển suốt 50 năm, trải qua quá trình xây dựng cộng đồng kéo dài hàng thập kỷ, ASEAN về căn bản đã hình thành một chương trình nghị sự và trở thành một trong những tổ chức khu vực thành công nhất”.<br>(https://nhandan.vn/megastory/2017/08/2/).", "image": "", "statements": [{"id": "a", "text": "Năm 1967, Hiệp hội các quốc gia Đông Nam Á (ASEAN) ra đời.", "correct": true}, {"id": "b", "text": "Quá trình phát triển thành viên của ASEAN diễn ra nhanh chóng và thuận lợi.", "correct": false}, {"id": "c", "text": "Cộng đồng ASEAN được thành lập trên cơ sở sự tương đồng về mục tiêu và con đường phát triển của các quốc gia.", "correct": false}, {"id": "d", "text": "Để duy trì sự ổn định và phát triển, Cộng đồng ASEAN cần tăng cường sự gắn kết và thống nhất thể chế chính trị.", "correct": false}], "explanation": ""}, {"id": 256, "lesson": "Bài 5", "lessonTitle": "Cộng đồng ASEAN: Từ ý tưởng đến hiện thực", "section": "Phần II. Câu trắc nghiệm đúng sai", "num": "2", "type": "truefalse", "question": "Cho những thông tin trong bảng liệu sau đây:<br><table class=\"qt\"><tr><th>Thời gian<\/th><th>Sự kiện tiêu biểu<\/th><\/tr><tr><td>1976<\/td><td>Hiệp ước Thân thiện và Hợp tác ở Đông Nam Á (Hiệp ước Ba-li) đươc kí kết.<\/td><\/tr><tr><td>1995<\/td><td>Việt Nam trở thành thành viên của tổ chức ASEAN.<\/td><\/tr><tr><td>1999<\/td><td>Cam-pu-chia trở thành thành viên của tổ chức ASEAN.<\/td><\/tr><tr><td>2007<\/td><td>Hiến chương ASEAN được thông qua.<\/td><\/tr><tr><td>2015<\/td><td>Cộng đồng ASEAN được xây dựng và phát triển với ba trụ cột chính là Cộng đồng Chính trị – An ninh, Cộng đồng Kinh tế và Cộng đồng Văn hóa – Xã hội.<\/td><\/tr><\/table>", "image": "", "statements": [{"id": "a", "text": "Bảng thông tin thể hiện các sự kiện của Hiệp hội các quốc gia Đông Nam Á (ASEAN).", "correct": true}, {"id": "b", "text": "Hiệp ước Ba-li (1976) và Hiến chương ASEAN (2007) là những văn kiện đánh dấu bước ngoặt trong quá trình phát triển của Hiệp hội các quốc gia Đông Nam Á.", "correct": true}, {"id": "c", "text": "Hiệp hội các quốc gia Đông Nam Á và Cộng đồng ASEAN là hai tổ chức riêng biệt.", "correct": false}, {"id": "d", "text": "Việt Nam trở thành thành viên của tổ chức ASEAN làm chấm dứt sự đối đầu ở khu vực Đông Nam Á trong thời kì Chiến tranh lạnh và tác động của xu thế toàn cầu hoá.", "correct": false}], "explanation": ""}, {"id": 257, "lesson": "Bài 5", "lessonTitle": "Cộng đồng ASEAN: Từ ý tưởng đến hiện thực", "section": "Phần II. Câu trắc nghiệm đúng sai", "num": "3", "type": "truefalse", "question": "Cho đoạn tư liệu sau đây:<br>“Trong quá trình tìm kiếm sự hợp tác giữa các nước Đông Nam Á đã xuất hiện những tổ chức khu vực và kí kết các hiệp ước giữa các nước trong khu vực. Tháng 1-1959, Hiệp ước hữu nghị và kinh tế Đông Nam Á (SAFET) bao gồm Malaixia và Philippin ra đời. Tháng 7-1961, Hội Đông Nam Á (ASA) gồm Malaixia, Philippin và Thái Lan duợc thành lập. Tháng 8-1963, một tổ chức gồm Malaixia, Philippin, Inđônêxia (MAPHILINDO) được thành lập. Tuy nhiên, những tổ chức trên đây không tồn tại được lâu do sự bất đồng giữa các nước về vấn đề lãnh thổ và chủ quyền”.<br>(Nguyễn Anh Thái (Chủ biên), Lịch sử thế giới hiện đại, NXB Giáo dục, Hà Nội, 1998, tr.358).", "image": "", "statements": [{"id": "a", "text": "Malaixia, Philippin, Thái Lan, Inđônêxia là những quốc gia sớm có ý tưởng về việc thành lập một tổ chức khu vực ở Đông Nam Á.", "correct": true}, {"id": "b", "text": "Yếu tố quyết định sự thành lập và mở rộng Hiệp hội các quốc gia Đông Nam Á (ASEAN) là các nước trong khu vực đã giành được độc lập và có nhu cầu hợp tác cùng phát triển.", "correct": true}, {"id": "c", "text": "Các tổ chức tiền thân của Hiệp hội các quốc gia Đông Nam Á (ASEAN) không tồn tại lâu do không thống nhất được giá cả và thị trường tiêu thụ hàng hoá.", "correct": false}, {"id": "d", "text": "Trong bối cảnh khu vực và quốc tế luôn ổn định, nhu cầu hợp tác để cùng phát triển giữa các nước trong khu vực Đông Nam Á là tất yếu.", "correct": false}], "explanation": ""}, {"id": 258, "lesson": "Bài 5", "lessonTitle": "Cộng đồng ASEAN: Từ ý tưởng đến hiện thực", "section": "Phần II. Câu trắc nghiệm đúng sai", "num": "4", "type": "truefalse", "question": "Cho đoạn tư liệu sau đây:<br>“ASEAN là một điều kỳ diệu sống động và mang hơi thở của cuộc sống hiện đại. Tại sao? Không một tổ chức khu vực nào khác đã làm được nhiều như Hiệp hội các quốc gia Đông Nam Á (ASEAN) trong việc cải thiện điều kiện sống của một bộ phận đáng kể nhân loại. Hơn 600 triệu người sống trong khu vực có bước tiến đáng kể trong 50 năm qua, kể từ khi Hiệp hội được thành lập. ASEAN đã mang lại hòa bình và thịnh vượng cho một khu vực từng gặp nhiều vấn đề, tạo ra sự hài hòa giữa các nền văn minh ở khu vực vốn đa dạng nhất hành tinh, mang lại niềm hy vọng cho người dân sống tại khu vực. ASEAN có thể cũng đóng vai trò như một chất xúc tác quan trọng cho sự trỗi dậy một cách hòa bình của Trung Quốc”.<br>(Kishore Mahbubani &amp; Jeffery Sng (Người dịch: Phạm Bích Phục), ASEAN Diệu Kỳ – Vì Một Cộng Đồng ASEAN Phát Triển Bền Vững Và Thịnh Vượng - Nhà xuất bản Thế Giới, Hà Nội, 2017, tr.11).", "image": "", "statements": [{"id": "a", "text": "Kể từ khi thành lập đến nay, ASEAN có nhiều nỗ lực trong việc kiến tạo hòa bình, thịnh vượng cho khu vực từng bị nô dịch, thống trị của chủ nghĩa thực dân.", "correct": true}, {"id": "b", "text": "Sự phát triển của ASEAN góp phần kiềm chế ảnh hưởng của các nước lớn vào khu vực Đông Nam Á, nhất là sự trỗi dậy một cách hòa bình của Trung Quốc.", "correct": true}, {"id": "c", "text": "ASEAN là một liên minh phát triển đến nhất thể hoá, ít phải đối mặt với các thách thức, mang lại hòa bình, thịnh vượng cho người dân sống tại khu vực.", "correct": false}, {"id": "d", "text": "Lịch sử và văn hoá Đông Nam Á là nhân tố ảnh hưởng đến nguyên tắc hoạt động, mục tiêu, định hướng phát triển của tổ chức liên kết khu vực ASEAN.", "correct": true}], "explanation": ""}, {"id": 259, "lesson": "Bài 5", "lessonTitle": "Cộng đồng ASEAN: Từ ý tưởng đến hiện thực", "section": "Phần II. Câu trắc nghiệm đúng sai", "num": "5", "type": "truefalse", "question": "Cho đoạn tư liệu sau đây:<br>“Chúng tôi nhắc lại tầm nhìn ASEAN về một cộng đồng thống nhất, hòa bình, ổn định và cùng chia sẻ sự phồn vinh, được xây dựng trên cơ sở các nguyện vọng và cam kết trong Hiệp ước Thân thiện và Hợp tác ở Đông Nam Á (TAC), Tầm nhìn ASEAN 2020, Tuyên bố Hòa hợp ASEAN II, Hiến chương ASEAN, Lộ trình Cộng đồng ASEAN (2009-2015) và Tuyên bố Ba-li về Cộng đồng ASEAN trong Cộng đồng các Quốc gia Toàn cầu”.<br>(https://aecvcci.vn/tin-tuc-n1561/tam-nhin-cong-dong-asean-2025.htm)", "image": "", "statements": [{"id": "a", "text": "Tư liệu phản ánh về mục đích và nguyên tắc thành lập của tổ chức ASEAN.", "correct": true}, {"id": "b", "text": "Cộng đồng ASEAN thành lập nhằm hỗ trợ các nước trong khu vực cùng phát triển.", "correct": false}, {"id": "c", "text": "Quá trình thành lập Cộng đồng ASEAN diễn ra lâu dài với sự dẫn dắt của các cường quốc trên nhiều lĩnh vực.", "correct": false}, {"id": "d", "text": "Cộng đồng ASEAN và Liên hợp quốc đều là những thể chế thống nhất có vai trò quan trọng trong việc duy trì hòa bình, ổn định thế giới.", "correct": false}], "explanation": ""}, {"id": 260, "lesson": "Bài 5", "lessonTitle": "Cộng đồng ASEAN: Từ ý tưởng đến hiện thực", "section": "Phần II. Câu trắc nghiệm đúng sai", "num": "6", "type": "truefalse", "question": "Cho những thông tin trong bảng sau đây:<br><table class=\"qt\"><tr><th>Thời gian<\/th><th>Nội dung<\/th><\/tr><tr><td>1967<\/td><td>Tổ chức ASEAN được thành lập.<\/td><\/tr><tr><td>1976<\/td><td>Hiệp ước Bali đề ra những nguyên tắc cơ bản trong quan hệ giữa các nước ASEAN.<\/td><\/tr><tr><td>1984<\/td><td>Brunay ra nhập ASEAN.<\/td><\/tr><tr><td>1995 - 1999<\/td><td>Việt Nam, Lào, Mianma và Campuchia gia nhập ASEN<\/td><\/tr><tr><td>2007<\/td><td>Ccác nước thành viên ký Hiến chương ASEAN nhằm xây dựng ASEAN thành một cộng đồng vững mạnh.<\/td><\/tr><\/table>", "image": "", "statements": [{"id": "a", "text": "Từ năm 1967 đến năm 1999 là quá trình phát triển từ ASEAN 5 đến ASEAN 10.", "correct": true}, {"id": "b", "text": "Hiến chương ASEAN đánh dấu sự ra đời của cộng đồng ASEAN với ba trụ cột chính.", "correct": false}, {"id": "c", "text": "Quá trình mở rộng thành viên của ASEAN diễn ra nhanh chóng, dồn dập.", "correct": false}, {"id": "d", "text": "Hiệp ước Bali đánh dấu sự khởi sắc của ASEAN trong quá trình phát triển.", "correct": true}], "explanation": ""}, {"id": 261, "lesson": "Bài 5", "lessonTitle": "Cộng đồng ASEAN: Từ ý tưởng đến hiện thực", "section": "Phần II. Câu trắc nghiệm đúng sai", "num": "7", "type": "truefalse", "question": "Cho đoạn tư liệu sau đây:<br>“Với tư cách là một thành viên của ASEAN, Việt Nam đã có thể giải quyết các vấn đề với các cường quốc trong vị thế cân bằng hơn khi tham gia vào các cuộc họp thường xuyên của ASEAN đối với các đối tác như Mỹ, Nhật Bản, Trung Quốc, Nga và EU. Bên cạnh đó, trở thành thành viên của ASEAN sẽ hỗ trợ cho Việt Nam gia nhập vào WTO, một thể chế quốc tế quan trọng khác để hội nhập vào nền kinh tế khu vực và toàn cầu”.<br>(Lê Minh Tiến, “25 năm hội nhập ASEAN - Một chặng đường gắn kết và chủ động thích ứng”,Tạp chí Luật học, số 12/2020, tr.8)", "image": "", "statements": [{"id": "a", "text": "Đoạn tư liệu phản ánh rõ vai trò của Việt Nam đối với tổ chức ASEAN từ khi thành lập.", "correct": false}, {"id": "b", "text": "Nhờ việc gia nhập ASEAN, Việt Nam đã đạt được thế cân bằng về sức mạnh với các cường quốc hàng đầu thế giới.", "correct": false}, {"id": "c", "text": "Khi Việt Nam trở thành thành viên của ASEAN, các nước Mỹ, Nhật Bản, Nga, EU lần lượt bình thường hóa quan hệ ngoại giao với Việt Nam.", "correct": false}, {"id": "d", "text": "Gia nhập ASEAN là cơ sở để Việt Nam đẩy mạnh quá trình hội nhập quốc tế về kinh tế.", "correct": true}], "explanation": ""}, {"id": 262, "lesson": "Bài 5", "lessonTitle": "Cộng đồng ASEAN: Từ ý tưởng đến hiện thực", "section": "Phần II. Câu trắc nghiệm đúng sai", "num": "8", "type": "truefalse", "question": "Cho đoạn tư liệu sau đây:<br>“Kể từ khi thành lập đến nay, tuy gặp nhiều khó khăn, phức tạp về chính trị, kinh tế, chịu sức ép của các nước lớn từ nhiều phía, nhưng tổ chức ASEAN đã tồn tại và phát triển với nhiều triển vọng tốt đẹp ở khu vực Đông Nam Á và trên thế giới. Từ một tổ chức không tên tuổi, liên kết các quốc gia nhỏ, yếu trong khu vực để đối phó với những thách thức từ bên trong và bên ngoài, trong đó trước hết là những thách thức về an ninh và kinh tế để bảo vệ sự tồn tại của mình, ngày nay ASEAN đã trở thành một tổ chức có uy tín lớn trên thế giới.”<br>(Nguyễn Anh Thái (chủ biên), Dịch sử thế giới hiện đại, NXB Giáo dục, Hà Nội, 2006, tr. 363)", "image": "", "statements": [{"id": "a", "text": "Bài học rút ra để tồn tại và phát triển của ASEAN là các nước trong khu vực cần tăng cường sự hợp tác, đoàn kết, tôn trọng nhau.", "correct": true}, {"id": "b", "text": "Trong quá trình phát triển ASEAN có nhiều điều kiện thuận lợi để nhanh chóng trở thành tổ chức uy tín và vững mạnh.", "correct": false}, {"id": "c", "text": "Việt Nam là một trong những quốc gia tiên phong trong việc thúc đẩy đoàn kết ASEAN trước các thách thức an ninh phi truyền thống.", "correct": true}, {"id": "d", "text": "Một trong những thách thức trong quá trình phát triển của ASEAN chính là sự chi phối của các nước lớn trong cục diện Chiến tranh lạnh.", "correct": true}], "explanation": ""}, {"id": 263, "lesson": "Bài 5", "lessonTitle": "Cộng đồng ASEAN: Từ ý tưởng đến hiện thực", "section": "Phần II. Câu trắc nghiệm đúng sai", "num": "9", "type": "truefalse", "question": "Cho đoạn tư liệu sau đây:<br>Tháng 11 – 2015, cùng với việc tuyên bố thành lập Cộng đồng ASEAN, các nhà lãnh đạo ASEAN đã thông qua văn kiện Tầm nhìn Cộng đồng ASEAN 2025 nhằm thúc đẩy hợp tác, gắn kết trong Cộng đồng ASEAN.<br>Tháng 11-2020, Hội nghị Cấp cao ASEAN lần thứ 37 diễn ra tại Hà Nội đã thông qua văn kiện Tuyên bố Hà Nội về Tầm nhìn Cộng đồng ASEAN sau năm 2025, hướng tới thúc đẩy hợp tác và hội nhập ngày càng chặt chẽ hơn trên các trụ cột AEC, APSC, ASCC.<br>Gần một thập kỉ sau khi thành lập, Cộng đồng ASEAN đã đạt được nhiều kết quả quan trọng. Tuy nhiên, trong bối cảnh mới, sự phát triển của Cộng đồng ASEAN đang đứng trước cả những thách thức và triển vọng lớn.<br>(Sách giáo khoa Lịch sử 12, bộ cánh diều, tr.27)", "image": "", "statements": [{"id": "a", "text": "Trong bối cảnh lịch sử mới, Cộng đồng ASEAN vừa đứng trước thời cơ, vừa phải đối mặt với những thách thức to lớn.", "correct": true}, {"id": "b", "text": "Văn kiện Tầm nhìn Cộng đồng ASEAN 2025 ra đời cùng với sự ra đời của Cộng đồng ASEAN.", "correct": true}, {"id": "c", "text": "Tầm nhìn Cộng đồng ASEAN 2025 và Tầm nhìn Cộng đồng ASEAN sau năm 2025 đều là hai văn kiện có tác dụng thúc đẩy sự hợp tác toàn diện giữa các nước trong Cộng đồng ASEAN.", "correct": true}, {"id": "d", "text": "Sự ra đời của Cộng đồng ASEAN và việc triển khai văn kiện Tầm nhìn Cộng đồng ASEAN 2025 hoàn toàn chỉ tạo ra thời cơ cho Việt Nam trong quá trình phát triển.", "correct": false}], "explanation": ""}, {"id": 264, "lesson": "Bài 5", "lessonTitle": "Cộng đồng ASEAN: Từ ý tưởng đến hiện thực", "section": "Phần II. Câu trắc nghiệm đúng sai", "num": "10", "type": "truefalse", "question": "Cho đoạn tư liệu sau đây:<br>Cộng đồng ASEAN ra đời là bước chuyển mới về chất của một ASEAN gắn kết, chia sẻ lợi ích và phát triển thịnh vượng chung với sự liên kết chặt chẽ trên cả ba trụ cột về Chính trị - An ninh, Kinh tế và Văn hóa – Xã hội, thể hiện vai trò và vị thế ngày càng cao của ASEAN trong khu vực và trên thế giới. Sự hình thành Cộng đồng ASEAN là dấu ấn lịch sử, ghi nhận một chặng đường phấn đấu không mệt mỏi của ASEAN; đồng thời, chuẩn bị nền tảng, định hướng và khuôn khổ cho ASEAN vững tin bước vào giai đoạn mới – giai đoạn củng cố vững mạnh. Cộng đồng hướng tới các mục tiêu liên kết cao hơn với những lợi ích cụ thể, thiết thực cho cả khu vực và từng nước thành viên mà bao trùm là giữ được môi trường hòa bình, ổn định, hợp tác vì phát triển và thịnh vượng.<br>(Sách giáo khoa Lịch sử 12, bộ chân trời sáng tạo, tr.32)", "image": "", "statements": [{"id": "a", "text": "Cộng đồng ASEAN được thành lập dựa trên ba trụ cột là Chính trị - An ninh, Kinh tế và Văn hóa – Xã hội.", "correct": true}, {"id": "b", "text": "Sự thành lập Cộng đồng ASEAN đánh dấu vai trò và vị thế của ASEAN bước đầu được khẳng định trong khu vực và trên thế giới.", "correct": false}, {"id": "c", "text": "Bản chất của việc thành lập Cộng đồng ASEAN là đưa ASEAN trở thành một tổ chức có mức độ liên kết cao hơn nhằm hướng tới mục tiêu cuối cùng là hòa bình, ổn định và phát triển thịnh vượng.", "correct": true}, {"id": "d", "text": "Sự thành lập Cộng đồng ASEAN là kết quả tất yếu của quá trình liên kết ASEAN trong một thời gian dài, phát triển từ thấp đến cao.", "correct": true}], "explanation": ""}];

/* ---------- tiện ích + bẫy lỗi hiển thị ---------- */
const $ = s => document.querySelector(s);
const E = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const plainQ = h => String(h).replace(/<[^>]+>/g, ' ').replace(/&amp;/g, '&').replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/\s+/g, ' ').trim();
let crashN = 0;
function crash(msg) {
  try {
    crashN++;
    let d = $('#crash');
    if (!d) { d = document.createElement('div'); d.id = 'crash'; document.documentElement.appendChild(d); }
    d.innerHTML = '<div class="cbox"><h2>⚠️ Ứng dụng gặp lỗi</h2><pre>' + E(msg) + '</pre><div class="mbtns"><button class="btn pri" data-act="recover">Khôi phục ứng dụng</button>' +
      (crashN > 1 ? '<button class="btn dan" data-act="resetSess">Xóa bài đang dở &amp; khởi động lại</button>' : '') + '</div></div>';
    d.style.display = 'flex';
  } catch (e2) { /* im lặng */ }
}
window.addEventListener('error', ev => crash((ev.message || 'Lỗi không rõ') + (ev.error && ev.error.stack ? '\n' + String(ev.error.stack).split('\n').slice(0, 3).join('\n') : '')));
window.addEventListener('unhandledrejection', ev => crash('Promise: ' + (ev.reason && ev.reason.message ? ev.reason.message : ev.reason)));

/* ---------- StorageEngine: IndexedDB + RAM, fallback LocalStorage ---------- */
const SE = (() => {
  let db = null, mode = 'idb';
  const P = 'qa1:';
  const openDb = () => new Promise(res => {
    try {
      if (!window.indexedDB) { mode = 'ls'; return res(); }
      const rq = indexedDB.open('quizapp_su12', 1);
      rq.onupgradeneeded = () => {
        const d = rq.result;
        if (!d.objectStoreNames.contains('kv')) d.createObjectStore('kv');
        if (!d.objectStoreNames.contains('attempts')) d.createObjectStore('attempts', { keyPath: 'id' });
      };
      rq.onsuccess = () => { db = rq.result; res(); };
      rq.onerror = () => { mode = 'ls'; res(); };
      rq.onblocked = () => { mode = 'ls'; res(); };
    } catch (e) { mode = 'ls'; res(); }
  });
  const tx = (store, m, fn) => new Promise(res => {
    try {
      const t = db.transaction(store, m);
      const r = fn(t.objectStore(store));
      t.oncomplete = () => res(r ? r.result : undefined);
      t.onerror = () => res(undefined);
      t.onabort = () => res(undefined);
    } catch (e) { res(undefined); }
  });

function tick() { const n = Date.now(); if (R.sess && !paused && UI.view === 'quiz') R.sess.elapsedMs += Math.max(0, n - lastTick); lastTick = n; }

function mkItems(ids, shuffle, group) {
  let list = ids.map(id => QM.get(id));

const flagIds = v => Object.keys(R.flags).filter(k => R.flags[k] === v).map(Number).filter(id => QM.has(id));

const fbBase = () => { const u = String(FIREBASE_URL || '').trim().replace(/\/+$/, ''); return /^https:\/\//i.test(u) ? u : ''; };
let lbData = {}, lbSt = 'off', lbES = null, lbPT = null;
async function lbSubmit(att) {

      if (!r.ok) throw new Error('HTTP ' + r.status);

    } catch (e) { toast('Không gửi được lên Firebase – đã lưu vào bảng xếp hạng cục bộ', 'info', '📴'); }
  } else toast('Chưa cấu hình Firebase – dùng bảng xếp hạng cục bộ', 'info', '💾');

function lbEv(type, raw) {

    if (p === '/') { if (type === 'put') lbData = d.data || {}; else Object.assign(lbData, d.data || {}); }
    else { const k = p.split('/').filter(Boolean)[0]; if (d.data == null && p.split('/').filter(Boolean).length === 1) delete lbData[k]; else if (p.split('/').filter(Boolean).length === 1) lbData[k] = type === 'patch' ? Object.assign(lbData[k] || {}, d.data) : d.data; }
    lbSt = 'live'; lbRefresh();
  } catch (e) { /* bỏ qua sự kiện lỗi */ }
}
function lbPoll() {

  const run = async () => { try { const r = await fetch(fbBase() + '/leaderboard.json'); if (!r.ok) throw new Error('x'); lbData = (await r.json()) || {}; lbSt = 'poll'; } catch (e) { lbSt = 'error'; } lbRefresh(); };
  run(); lbPT = setInterval(run, 8000);
}
function lbStop() { if (lbES) { lbES.close(); lbES = null; } if (lbPT) { clearInterval(lbPT); lbPT = null; } }
function lbStart() {
  lbStop();

  lbSt = 'connecting';
  try {
    lbES = new EventSource(b + '/leaderboard.json');
    lbES.addEventListener('put', ev => lbEv('put', ev.data));
    lbES.addEventListener('patch', ev => lbEv('patch', ev.data));

}

const pad = $('#pad'), pctx = pad.getContext('2d');
let padOnF = false, padColor = '#ffffff', padErase = false, drawing = false, inked = false, lastPt = null;
function padFit() {
  const d = window.devicePixelRatio || 1, w = pad.clientWidth, h = pad.clientHeight;
  if (pad.width !== Math.round(w * d) || pad.height !== Math.round(h * d)) { pad.width = Math.round(w * d); pad.height = Math.round(h * d); inked = false; }
  pctx.setTransform(d, 0, 0, d, 0, 0); pctx.lineCap = 'round'; pctx.lineJoin = 'round';
}
function padSync() {
  const inQ = UI.view === 'quiz';
  const show = inQ && (padOnF || inked);
  pad.style.display = show ? 'block' : 'none';
  if (show) {
    const t = $('.top'), f = $('.foot');
    const tb = t ? t.getBoundingClientRect().bottom : 90, fb = f ? window.innerHeight - f.getBoundingClientRect().top : 64;
    pad.style.top = tb + 'px'; pad.style.bottom = fb + 'px'; padFit();
    $('#padbar').style.top = (tb + 6) + 'px';
  }
  pad.style.pointerEvents = padOnF ? 'auto' : 'none';
  $('#padbar').style.display = inQ && padOnF ? 'flex' : 'none';
}
function padClear() { pctx.setTransform(1, 0, 0, 1, 0, 0); pctx.clearRect(0, 0, pad.width, pad.height); inked = false; }
function padOff() { padOnF = false; padClear(); padSync(); }
const padPos = ev => { const r = pad.getBoundingClientRect(); return { x: ev.clientX - r.left, y: ev.clientY - r.top }; };
pad.addEventListener('pointerdown', ev => {
  if (!padOnF) return; drawing = true; lastPt = padPos(ev);

  pctx.globalCompositeOperation = padErase ? 'destination-out' : 'source-over'; pctx.strokeStyle = padColor; pctx.lineWidth = padErase ? 24 : 3;

pad.addEventListener('pointerup', padEnd); pad.addEventListener('pointercancel', padEnd);

function exportJSON() {
  try {
    const d = { app: 'NHT-quiz-su12', version: 1, exportedAt: new Date().toISOString(), name: R.name, attempts: R.attempts, notes: R.notes, flags: R.flags };
    const bl = new Blob([JSON.stringify(d)], { type: 'application/json' }), u = URL.createObjectURL(bl), a = document.createElement('a');
    a.href = u; a.download = 'sao-luu-on-tap-' + new Date().toISOString().slice(0, 10) + '.json'; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(u), 4000); toast('Đã xuất ' + R.attempts.length + ' lượt làm bài', 'good', '⬇️');
  } catch (e) { toast('Xuất file thất bại: ' + e.message, 'bad', '⚠️'); }
}
function importJSON(file) {
  const rd = new FileReader();
  rd.onload = () => {
    try {
      const d = JSON.parse(rd.result);
      if (!d || !Array.isArray(d.attempts)) throw new Error('File không đúng định dạng sao lưu');
      let add = 0; const have = new Set(R.attempts.map(a => a.id));
      d.attempts.forEach(a => { if (a && a.id && Array.isArray(a.items) && !have.has(a.id)) { R.attempts.push(a); SE.putAttempt(a); have.add(a.id); add++; } });
      R.attempts.sort((a, b) => b.at - a.at);
      if (d.notes && typeof d.notes === 'object') { Object.assign(R.notes, d.notes); SE.putKV('notes', R.notes); }
      if (d.flags && typeof d.flags === 'object') { Object.assign(R.flags, d.flags); SE.putKV('flags', R.flags); }
      if (d.name && !R.name) { R.name = String(d.name); SE.putKV('name', R.name); }
      recomputeStats(); render(); toast('Đã nhập ' + add + ' lượt làm bài mới', 'good', '⬆️');
    } catch (e) { toast('Nhập file thất bại: ' + e.message, 'bad', '⚠️'); }
  };
  rd.onerror = () => toast('Không đọc được file', 'bad', '⚠️');
  rd.readAsText(file);
}

    default: break;
  }
});
document.addEventListener('contextmenu', ev => {
  const o = ev.target.closest('.opt[data-act="pick"]'); if (!o || UI.view !== 'quiz' || !R.sess) return;
  ev.preventDefault();
  const s = R.sess, it = s.items[s.idx]; if (s.mode === 'practice' && it.ck) return;
  const k = +o.dataset.i, p = it.x.indexOf(k); if (p >= 0) it.x.splice(p, 1); else it.x.push(k); saveSess(); render();
});
let noteT = null;
document.addEventListener('input', ev => {
  const t = ev.target;
  if (t.id === 'nameIn') { R.name = t.value.trim(); SE.putKV('name', R.name); }
  else if (t.id === 'minIn') CFG.minutes = Math.max(0, parseInt(t.value, 10) || 0);
  else if (t.id === 'shortIn' && R.sess) {
    const s = R.sess, it = s.items[s.idx]; it.a = t.value; saveSess();
    const st = $('#stat'), mb = $('#mainBtn'), q = QM.get(it.q);
    if (st) st.textContent = 'Câu ' + (s.idx + 1) + ' - ' + statusTxt(it, q);
    if (mb && s.mode === 'practice') mb.disabled = !ready(it, q);
  } else if (t.id === 'noteIn') {
    const id = t.dataset.q, v = t.value; clearTimeout(noteT);
    noteT = setTimeout(() => { if (v.trim()) R.notes[id] = v; else delete R.notes[id]; SE.putKV('notes', R.notes); }, 350);
    if (v.trim()) R.notes[id] = v; else delete R.notes[id];
  }
});
document.addEventListener('change', ev => {
  if (ev.target.id === 'lbSel') { UI.lbL = ev.target.value; render(); }
  else if (ev.target.id === 'impFile') { const f = ev.target.files && ev.target.files[0]; if (f) importJSON(f); ev.target.value = ''; }
});
document.addEventListener('keydown', ev => {
  if (UI.view !== 'quiz' || !R.sess || $('#modal').firstChild || ev.ctrlKey || ev.metaKey || ev.altKey) return;
  const s = R.sess, it = s.items[s.idx], q = QM.get(it.q), t = ev.target, typing = t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA');
  if (typing) { if (ev.key === 'Enter' && t.id === 'shortIn') { ev.preventDefault(); mainAct(); } return; }
  const k = ev.key;
  if (k === 'Enter' || k === ' ') { ev.preventDefault(); const mb = $('#mainBtn'); if (mb && !mb.disabled) mainAct(); return; }
  if (k === 'ArrowLeft') { go(s.idx - 1); return; }
  if (k === 'ArrowRight') { go(s.idx + 1); return; }
  if (q.type === 'single' && !(s.mode === 'practice' && it.ck)) {
    let i = -1;
    if (/^[1-8]$/.test(k)) i = +k - 1; else if (/^[a-hA-H]$/.test(k)) i = k.toLowerCase().charCodeAt(0) - 97;
    if (i >= 0 && i < it.perm.length) { it.a = it.perm[i]; saveSess(); render(); }
  }
});
document.addEventListener('visibilitychange', () => { if (document.hidden) { saveSess(); paused = true; } else { lastTick = Date.now(); paused = false; } });
window.addEventListener('pagehide', saveSess);
window.addEventListener('beforeunload', saveSess);
setInterval(() => {
  if (UI.view !== 'quiz' || !R.sess || paused) return;
  tick(); const s = R.sess, ex = s.mode === 'exam', rem = s.limitMs - s.elapsedMs, el = $('#timer');
  if (el) el.textContent = '⏱ ' + fmtT(ex ? Math.max(0, rem) : s.elapsedMs);
  if (++tmCount % 5 === 0) saveSess();
  if (ex && rem <= 0) { toast('Hết giờ! Hệ thống tự nộp bài', 'bad', '⏰'); finish(); }
}, 1000);

/* ---------- khởi động ---------- */
async function loadAll() {
  await SE.init();
  R.name = (await SE.getKV('name')) || '';
  R.notes = (await SE.getKV('notes')) || {};
  R.flags = (await SE.getKV('flags')) || {};
  R.attempts = (await SE.allAttempts()) || []; R.attempts.sort((a, b) => b.at - a.at); recomputeStats();
  const s1 = await SE.getKV('session'); let s2 = null;
  try { s2 = JSON.parse(localStorage.getItem('qa1:session') || 'null'); } catch (e) { s2 = null; }
  const c = [s1, s2].filter(validSess).sort((a, b) => (b.savedAt || 0) - (a.savedAt || 0));
  R.sess = c[0] || null;
  try { R.lbLocal = JSON.parse(localStorage.getItem('qa1:lb_local') || '[]'); } catch (e) { R.lbLocal = []; }
}
function init() {
  loadAll().then(() => {
    lastTick = Date.now(); render();
    if (R.sess) showModal('Bài đang làm dở', 'Bạn có một bài đang làm dở (đang ở <b>Câu ' + (R.sess.idx + 1) + '/' + R.sess.items.length + '</b>, đã làm ' + fmtT(R.sess.elapsedMs) + '). Làm tiếp không?', [{ t: 'Để sau' }, { t: '▶️ Tiếp tục', cls: 'pri', cb: resume }]);
    if (SE.mode() !== 'idb') toast('Trình duyệt không hỗ trợ IndexedDB – đang dùng LocalStorage', 'info', 'ℹ️');
  }).catch(e => crash('Khởi tạo thất bại: ' + (e && e.message ? e.message : e)));
}
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init); else init();
})();
</script>
